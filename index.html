<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis Zat dan Perubahannya</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2433;--mu:#66738a;--pr:#2f6fed;--ok:#1f9d55;--no:#d64545;--bd:#d9e0ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2230;--tx:#e8edf6;--mu:#93a0b8;--pr:#6c9bff;--ok:#3ecf7b;--no:#ff6b6b;--bd:#2c374a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2230;--tx:#e8edf6;--mu:#93a0b8;--pr:#6c9bff;--ok:#3ecf7b;--no:#ff6b6b;--bd:#2c374a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{font-size:1.4rem;margin:0 0 8px}
p{color:var(--mu);line-height:1.5}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mu);margin-bottom:8px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;width:0;background:var(--pr);transition:width .3s}
.q{font-size:1.1rem;font-weight:600;line-height:1.4;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:1rem;cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,transparent)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
.btn[hidden]{display:none}
.fb{min-height:24px;font-weight:600;margin:4px 0 10px}
.big{font-size:3rem;font-weight:800;text-align:center;margin:8px 0}
.c{text-align:center}
</style>
</head>
<body>
<div class="app"><div class="card" id="box"></div></div>
<script>
const Q=[
["Tiga wujud zat yang umum adalah...",["Padat, cair, gas","Padat, cair, api","Cair, gas, asap","Padat, gas, debu"],0],
["Zat yang bentuk dan volumenya tetap adalah zat...",["Padat","Cair","Gas","Uap"],0],
["Ciri zat cair adalah...",["Bentuk tetap, volume tetap","Bentuk mengikuti wadah, volume tetap","Bentuk dan volume berubah","Bentuk tetap, volume berubah"],1],
["Ciri zat gas adalah...",["Volumenya tetap","Partikelnya sangat rapat","Mengisi seluruh ruang wadah","Tidak dapat dimampatkan"],2],
["Perubahan wujud dari padat menjadi cair disebut...",["Menguap","Mencair","Membeku","Menyublim"],1],
["Perubahan wujud dari cair menjadi padat disebut...",["Membeku","Mencair","Mengembun","Menguap"],0],
["Perubahan wujud dari cair menjadi gas disebut...",["Mengembun","Membeku","Menguap","Menyublim"],2],
["Perubahan wujud dari gas menjadi cair disebut...",["Menguap","Mengembun","Menyublim","Mencair"],1],
["Perubahan wujud dari padat langsung menjadi gas disebut...",["Mengkristal","Mencair","Menguap","Menyublim"],3],
["Perubahan wujud dari gas langsung menjadi padat disebut...",["Mengkristal","Mencair","Membeku","Menguap"],0],
["Contoh peristiwa menyublim adalah...",["Es batu mencair","Embun di daun","Air mendidih","Kapur barus mengecil"],3],
["Embun pagi di daun terjadi karena peristiwa...",["Menguap","Membeku","Mengembun","Mencair"],2],
["Air murni mendidih pada suhu ... (tekanan 1 atm)",["50°C","100°C","0°C","212°C"],1],
["Air murni membeku pada suhu...",["0°C","100°C","-10°C","32°C"],0],
["Berikut yang termasuk perubahan fisik adalah...",["Kayu terbakar","Besi berkarat","Es mencair","Makanan membusuk"],2],
["Berikut yang termasuk perubahan kimia adalah...",["Gula larut dalam air","Kertas disobek","Lilin meleleh","Kertas dibakar"],3],
["Ciri utama perubahan kimia adalah...",["Terbentuk zat baru","Hanya berubah bentuk","Hanya berubah ukuran","Zat penyusun tetap sama"],0],
["Besi berkarat termasuk...",["Perubahan fisik","Perubahan kimia","Perubahan wujud","Pelarutan"],1],
["Contoh perubahan fisik adalah...",["Menggoreng telur","Singkong menjadi tape","Menghancurkan batu","Membakar bensin"],2],
["Tanda terjadinya perubahan kimia adalah...",["Dipotong kecil","Diremas","Timbul gas atau perubahan warna","Dilipat"],2],
["Berikut yang termasuk unsur adalah...",["Air","Garam dapur","Udara","Oksigen"],3],
["Berikut yang termasuk senyawa adalah...",["Emas","Air (H₂O)","Oksigen","Besi"],1],
["Berikut yang termasuk campuran adalah...",["Air garam","Emas murni","Oksigen","Aluminium"],0],
["Contoh campuran homogen adalah...",["Air dan minyak","Pasir dan air","Larutan gula","Tanah dan kerikil"],2],
["Contoh campuran heterogen adalah...",["Teh manis","Air sirup","Udara bersih","Air dan pasir"],3],
["Cara memisahkan pasir dari air adalah...",["Penyaringan","Penguapan","Sublimasi","Menggunakan magnet"],0],
["Cara memperoleh garam dari air laut adalah...",["Penyaringan","Penguapan","Menggunakan magnet","Dipungut dengan tangan"],1],
["Cara memisahkan serbuk besi dari pasir adalah...",["Penyaringan","Penguapan","Dekantasi","Menggunakan magnet"],3],
["Dalam larutan gula, zat yang berperan sebagai pelarut adalah...",["Gula","Air","Udara","Panas"],1],
["Satuan terkecil unsur yang masih memiliki sifat unsur tersebut adalah...",["Atom","Molekul","Senyawa","Campuran"],0]
];
const box=document.getElementById('box');
let i=0,s=0,done=false;
function start(){
  i=0;s=0;
  box.innerHTML='<h1>🧪 Kuis Zat dan Perubahannya</h1><p>30 soal pilihan ganda tentang wujud zat, perubahan fisik dan kimia, serta campuran. Siap menguji pengetahuanmu?</p><button class="btn" id="go">Mulai Kuis</button>';
  document.getElementById('go').onclick=show;
}
function show(){
  done=false;
  const [q,o,a]=Q[i];
  box.innerHTML='<div class="top"><span>Soal '+(i+1)+' / '+Q.length+'</span><span>Skor: '+s+'</span></div><div class="bar"><div style="width:'+(i/Q.length*100)+'%"></div></div><p class="q">'+q+'</p><div id="opts"></div><div class="fb" id="fb"></div><button class="btn" id="nx" hidden></button>';
  const L=['A','B','C','D'],d=document.getElementById('opts');
  o.forEach((t,k)=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=L[k]+'. '+t;
    b.onclick=()=>pick(k,a);
    d.appendChild(b);
  });
}
function pick(k,a){
  if(done)return;done=true;
  const bs=document.querySelectorAll('.opt');
  bs.forEach((b,j)=>{b.disabled=true;if(j===a)b.classList.add('ok');});
  const fb=document.getElementById('fb');
  if(k===a){s++;fb.textContent='✅ Benar!';fb.style.color='var(--ok)';}
  else{bs[k].classList.add('no');fb.textContent='❌ Kurang tepat. Jawaban benar ditandai hijau.';fb.style.color='var(--no)';}
  const n=document.getElementById('nx');
  n.hidden=false;n.textContent=i===Q.length-1?'Lihat Hasil':'Soal Berikutnya';
  n.onclick=()=>{i++;i<Q.length?show():end();};
}
function end(){
  const p=Math.round(s/Q.length*100);
  const m=p>=90?'Luar biasa! 🏆':p>=70?'Bagus sekali! 🎉':p>=50?'Cukup baik, ayo belajar lagi 📚':'Jangan menyerah, coba lagi! 💪';
  box.innerHTML='<h1 class="c">Hasil Kuis</h1><div class="big">'+s+' / '+Q.length+'</div><p class="c">Nilai kamu: <b>'+p+'</b><br>'+m+'</p><button class="btn" id="rs">Main Lagi</button>';
  document.getElementById('rs').onclick=start;
}
start();
</script>
</body>
</html>
